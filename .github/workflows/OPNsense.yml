name: OPNsense
on:
  schedule:
    - cron: '10 9 * * *'
  workflow_dispatch:
  push:
    branches:
      - '*'
    paths:
      - '**.sh'
      - '.github/workflows/OPNsense.yml'
  pull_request:
    branches:
      - '*'
    paths:
      - '**.sh'
      - '.github/workflows/OPNsense.yml'


concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

jobs:
  OPNsense:
    strategy:
      matrix:
        release: [""]
    runs-on: ubuntu-latest
    env:
      TEST_PREFERRED_CHAIN: (STAGING) Pretend Pear X1
      TEST_ACME_Server: "LetsEncrypt.org_test"
    steps:
    - uses: actions/checkout@v7
    - uses: anyvm-org/cf-tunnel@v0
      id: tunnel
      with:
        protocol: http
        port: 8080
    - name: Set envs
      run: echo "TestingDomain=${{steps.tunnel.outputs.server}}" >> $GITHUB_ENV
    - name: Set CASE
      if: github.event_name == 'push'
      shell: bash
      env:
        HEAD_COMMIT_MSG: ${{ github.event.head_commit.message }}
      run: |
        _case="$(printf '%s' "$HEAD_COMMIT_MSG" | tr ' \t' '\n\n' | grep '^CASE=le_test_' | head -1 | cut -d '=' -f 2- || true)"
        if [ -n "$_case" ]; then
          echo "CASE=$_case" >> "$GITHUB_ENV"
        fi
    - uses: vmactions/opnsense-vm@v1
      with:
        envs: 'TestingDomain TEST_PREFERRED_CHAIN TEST_ACME_Server CASE'
        debug-on-error: ${{ vars.DEBUG_ON_ERROR }}
        cache-after-prepare: true
        nat: |
          "8080": "80"
        prepare: |
          pkg install -y socat curl
          #OPNsense is a firewall appliance: its web GUI keeps an http redirect
          #on the 80 port, where every --standalone case listens. Dropping the
          #redirect frees 80 and leaves the GUI on 443, and the edit is in
          #config.xml, so it survives the cache-after-prepare reboot. Giving
          #acme.sh another port instead does not work here: pf passes inbound
          #22/80/443 only, and a pfctl -d does not survive that reboot.
          grep -q disablehttpredirect /conf/config.xml || sed -i '' -e 's|<webgui>|<webgui><disablehttpredirect>1</disablehttpredirect>|' /conf/config.xml
          configctl webgui restart
        usesh: true
        sync: nfs
        release: ${{ matrix.release }}
        run: ./letest.sh
